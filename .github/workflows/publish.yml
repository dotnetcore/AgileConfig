name: publish ci workflow

on:
  push:
    branches: [ publish ]
    paths-ignore:
      - '**/*.md'
      - '**/*.yml'
  workflow_dispatch:

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # The React admin UI is built inside the Dockerfile (ui-build stage), so there
  # is no separate build-reactapp job here.
  build-dotnet-push-to-hub:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container
        
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_NAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}
        
    - name: Login to ACR
      uses: aliyun/acr-login@v1
      with:
        login-server: https://registry.cn-shanghai.aliyuncs.com
        username: "${{ secrets.ALI_REGISTRY_USERNAME }}"
        password: "${{ secrets.ALI_REGISTRY_PASSWORD }}"

    # 一次构建，同时推送多架构 manifest 到两个 registry
    - name: Build and push multi-arch image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: ${{ env.PLATFORMS }}
        push: true
        tags: kklldog/agile_config:latest
